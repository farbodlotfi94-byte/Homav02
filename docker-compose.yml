version: '3.8'

services:
  homav-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homav-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - homav-network
    labels:
      - "dokploy.app.name=homav-frontend"
      - "dokploy.app.description=HomaV React Frontend Application"
      - "dokploy.app.version=0.1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  homav-network:
    driver: bridge
    name: homav-network
